aid: cambrian-bio
name: Cambrian Bio
description: 'Cambrian Bio (Cambrian BioPharma, Inc.) is a New York-headquartered clinical-stage
  drug development company working on the biology of aging. It runs a distributed "PipeCo"
  model — sourcing promising academic and early-stage science, then capitalizing and staffing
  each program as a separate subsidiary company under a shared development engine — to advance
  therapeutics that target the metabolic pathways that decline with age, first as treatments
  for chronic metabolic disease and ultimately as preventive medicines that extend healthspan.
  Its lead program, ATX-304, is an AMPK network activator with reported positive human
  translational data. Cambrian Bio is a therapeutics developer, not a software vendor: it
  publishes a corporate website, a science and pipeline overview, news and publications, and
  a blog, but no public API, developer portal, SDK, or machine-readable specification.'
